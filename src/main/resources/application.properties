# =============================================================================
# NO CREDENTIAL BELONGS IN THIS FILE. The ${...} placeholders are resolved from the
# environment, with no defaults, so an unset one aborts startup instead of letting the
# app run half-configured against prod.
#   prod  -- .github/workflows/deploy.yml writes /opt/apps/sms-app.env (0600) from the
#            repo's GitHub Actions secrets; a systemd drop-in feeds it to sms-app.service.
#   local -- application-dev.properties (gitignored) supplies them; run with the `dev`
#            profile. Adding a secret means: placeholder here, a printf line in that
#            workflow step, envs:/env: entries, `gh secret set`, and a line in the dev file.
# Usernames, hosts, ports and package ids stay here on purpose -- they are not secrets.
# =============================================================================

server.my-server-url=connect.synqafrica.co.ke
app.public-base-url=https://backend.synqafrica.co.ke

spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER
server.forward-headers-strategy=native

spring.sql.init.mode=always
spring.sql.init.platform=postgres
#spring.datasource.url=jdbc:postgresql://synq-africa-rds-postgresql.c184umyqqojw.eu-west-2.rds.amazonaws.com:5687/synq_africa_rds?options=-c%20TimeZone=Africa/Nairobi
#spring.datasource.url=jdbc:postgresql://62.171.173.25:5432/synq_africa_rds?options=-c%20TimeZone=Africa/Nairobi
spring.datasource.url=jdbc:postgresql://localhost:5432/synq_africa_rds?options=-c%20TimeZone=Africa/Nairobi
spring.datasource.username=synqadmin
spring.datasource.password=${DB_PASSWORD}
# --- Time zone. Every timestamp this app writes is produced by the JVM in Africa/Nairobi
# (see utils/AppTime); no query reads the DB clock. The three settings below are belt-and-braces:
# they only matter the day a column becomes `timestamptz`, or for a stray DB-side default.
spring.jackson.time-zone=Africa/Nairobi
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Nairobi
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Africa/Nairobi'

# --- Connection pool (Hikari) — sized for a 4-core / 8GB box with Postgres co-located on localhost.
# A SMALL pool is correct here: Postgres serves far better with a handful of active connections per
# core than with 100 (100 backends would thrash the 4 cores and eat RAM that PG/RabbitMQ/JVM share).
# The pool is the hard ceiling on concurrent DB work; the RabbitMQ workers and Tomcat threads below
# are sized to fit under it. Keep DB max_connections (postgresql.conf) >= this + headroom for psql.
#
# Raised 25 -> 32 alongside sms.listener.max-concurrency (32). Note that send concurrency is NOT bounded
# 1:1 by this pool: a send thread holds no DB connection while it waits on the carrier's socket, which is
# most of its cycle, so 32 senders draw far fewer than 32 connections on average. 32 covers the bursts
# plus Tomcat and the crons.
spring.datasource.hikari.maximum-pool-size=32
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1740000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.leak-detection-threshold=30000

#--------------------JPA-ORM Properties-----------------
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# Batch inserts/updates so bulk sends do fewer DB round-trips.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
# NOTE: open-in-view is left at its default (true). Setting it false frees DB connections earlier
# (recommended under load) but can surface LazyInitializationException during JSON serialization —
# flip it to false and smoke-test every screen before relying on it. See PERFORMANCE_TUNING.md.


application.security.jwt.secret-key=${JWT_SECRET_KEY}

# expires in 30 minutes
application.security.jwt.expiration= 7200000
application.security.jwt.refresh-token.expiration: 604800000



spring.rabbitmq.host=localhost
spring.rabbitmq.username=synqadminuser
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.port=5672


# --- Redis (co-located on the VM). Used to cache the Safaricom SDP access token across restarts
# and instances. A single shared Lettuce connection is fine here (low command volume, thread-safe).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.password=${REDIS_PASSWORD}
# Assumed validity of the Safaricom SDP token (it carries no expires_in). The token is cached for
# (this minus 2 minutes), so it is refreshed shortly before Safaricom invalidates it.
safaricom.token.expiry-minutes=60


rabbitmq.exchange.name=exchange
rabbitmq.routing.key=routing_key

# --- SMS throughput -------------------------------------------------------------------------------
# The send listener processes each message synchronously on its consumer thread, so throughput is
# exactly (consumers / per-message latency) and these ARE the concurrent-send counts. At 16 consumers
# and a ~296ms round trip the queue drained at ~54 msg/s with every consumer busy 100% of the time.
# Those threads sit blocked on the carrier's socket rather than on CPU or a DB connection, so 4 cores
# carry far more of them than 16. Externalised so the ceiling can be retuned against the carrier's real
# TPS limit without a rebuild — grep the logs for `carrierMs=` to see the current round-trip time.
# Raising max-concurrency also requires raising spring.datasource.hikari.maximum-pool-size.
sms.listener.concurrency=16
sms.listener.max-concurrency=32

# Carriers post back roughly one DLR per sent SMS, so the DLR listener has to scale with the senders.
dlr.listener.concurrency=8
dlr.listener.max-concurrency=16

# TTL for the account / reseller / sender-ID / creator lookups on the send path (SendMetadataCache).
# Balances are never cached — the debit is a guarded UPDATE against the live row — so this only delays
# how quickly an SMS price change, rename or sender-type change reaches sends already in flight.
sms.metadata-cache.ttl-seconds=60



spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


safaricom.safBaseUrl=https://dsvc2.safaricom.com:9480
safaricom.safCpId=281
safaricom.safUserName=synqafrica
safaricom.safApiUserName=synqapi
safaricom.safPassword=${SAF_SDP_PASSWORD}
#safaricom.safPromotionalPackageId=4609
safaricom.safTransactionalPackageId=6983

safaricom.safPromotionalPackageId=6303
safaricom.safResponseUrl=https://backend.synqafrica.co.ke/api/v2/public/dlr




server.port=8443

server.tomcat.connection-timeout=520s
server.tomcat.keep-alive-timeout=520s
spring.mvc.async.request-timeout=300000

# --- HTTP server thread pool — capped so the admin/API tier can't spawn 200 threads on 4 cores.
# 64 worker threads is ample for the portal + REST API; requests beyond that queue (accept-count).
server.tomcat.threads.max=64
server.tomcat.threads.min-spare=8
server.tomcat.accept-count=100
server.tomcat.max-connections=4000

# --- @Scheduled crons share ONE thread by default, so a slow tick (e.g. the SMS retry batch making
# Airtel calls) blocks every other cron (M-Pesa B2C status, callbacks, low-balance). Give them a pool.
spring.task.scheduling.pool.size=4


sms.airtel.allowForAll=false
# Sender ID used on Airtel when the account/reseller has none registered with
# sh_msn_provider = AIRTEL in msg.shortcode / msg.shortcode_setup.
sms.airtel.defaultSenderId=letstalk

# ---------------------------------------------------------------
# Safaricom API version selector
#   v1 = legacy SDP (dsvc2.safaricom.com:9480)
#   v2 = Daraja REST API (https://dsdpstg-apinb.safaricom.com)
# ---------------------------------------------------------------
safaricom.api.version=v2

# Safaricom DSDP REST API (v2)
#safaricom.rest.baseUrl=https://dsdpstg-apinb.safaricom.com




safaricom.rest.baseUrl=https://dsdp-apinb.safaricom.com
safaricom.rest.username=syncafrica_api
safaricom.rest.password=${SAF_REST_PASSWORD}

# DSDP v2 cross-checks this against the token's account: it must be the Safaricom-assigned
# external account ID (EXT_ID_*), NOT the login username — else 403 INVALID_USER_TOKEN
# "Token belongs to a different user". (v1 SDP didn't enforce this.)
#safaricom.rest.senderUserName=EXT_ID_13664
safaricom.rest.senderUserName=31
safaricom.rest.responseUrl=https://backend.synqafrica.co.ke/api/v2/public/dlr
safaricom.rest.promotionalPackageId=940
safaricom.rest.transactionalPackageId=941

