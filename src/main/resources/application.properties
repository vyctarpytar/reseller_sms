# ---------------------------------------------------------------
mpesa.gateway.baseUrl=https://c2b.waretechlimited.com
mpesa.gateway.shortcode=4037171
mpesa.gateway.b2cPaybill=4037171
mpesa.gateway.authToken=${MPESA_GATEWAY_AUTH_TOKEN:}

# Scheduled notifications / reminders dispatcher tick
notifications.scheduler.interval-ms=60000
